<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Rotina+</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #2dd4bf;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0d9488;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
  }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 3px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  .manual-link {
    display: none;
    background: var(--accent);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 10px;
    margin-top: 8px;
  }
  .fallback { display: none; margin-top: 20px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Abrindo o Rotina+...</h1>
    <p id="subtitle">Se o app estiver instalado, ele abre sozinho em instantes.</p>
    <a class="manual-link" id="manual-link" href="#">Toque aqui pra abrir</a>
    <p class="fallback" id="fallback">
      Não tem o Rotina+ instalado ainda? Peça pra quem te mandou esse link
      compartilhar o instalador do app com você.
    </p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var data = params.get('data');
      var titleEl = document.getElementById('title');
      var subtitleEl = document.getElementById('subtitle');
      var spinnerEl = document.getElementById('spinner');
      var manualLinkEl = document.getElementById('manual-link');
      var fallbackEl = document.getElementById('fallback');

      if (!data) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = 'Link incompleto';
        subtitleEl.textContent = 'Faltou o código de vínculo neste link. Peça um novo link ou o QR Code direto pra quem te convidou.';
        return;
      }

      var target = 'rotinaplus://import?data=' + encodeURIComponent(data);
      manualLinkEl.href = target;
      manualLinkEl.style.display = 'inline-block';
      fallbackEl.style.display = 'block';

      // Alguns navegadores só permitem abrir um app externo a partir de um
      // gesto do usuário (não durante o carregamento da página) — por isso
      // o botão manual acima SEMPRE aparece, além da tentativa automática.
      window.location.href = target;
    })();
  </script>
</body>
</html>
